# Dissertation number gate as CI.
#
# Drop this file at .github/workflows/number-gate.yml in the dissertation
# repository. On every push/PR it checks out bao-noise-tolerance (for the
# gate script and out/*.csv) and the pilot-proxy provenance snapshot, then
# runs the historical 67/67 number gate against dissertation.tex + chapters/,
# scanning the frozen figure data for figure-borne numbers. It also verifies
# the immutable vendored evidence releases. Both checkers are stdlib-only, so
# no pip install step is needed.
#
# If WVURAIL/bao-noise-tolerance or WVURAIL/pilot-proxy are private, add
#   token: ${{ secrets.GH_PAT }}
# to their checkout steps (a fine-grained PAT with read access).
#
# Pair this with Overleaf's GitHub Sync (Overleaf: Menu -> Sync -> GitHub)
# so edits made on Overleaf land here and get gated automatically.

name: dissertation-number-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dissertation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out bao-noise-tolerance (gate + out/*.csv)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: WVURAIL/bao-noise-tolerance
          # Pin the number gate and its data products so an upstream default-
          # branch change cannot alter this dissertation's CI result silently.
          ref: 99a48ef1a0173c05bc1e3799a3b0fca26a2338f6
          path: bao
          persist-credentials: false

      - name: Check out pilot-proxy provenance snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: WVURAIL/pilot-proxy
          # Keep the provenance input immutable for the same reason.
          ref: 62ae33ba9e1b303ea7432730f2c09fb59787946c
          path: pilot-proxy
          persist-credentials: false
          sparse-checkout: |
            data/provenance

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run the number gate
        # With .number-gate-baseline committed (a file holding the current
        # FAIL count), CI is a ratchet: green unless a push adds failures.
        # Without the file, the strict gate applies (red until 0 failures).
        run: |
          python bao/scripts/check_dissertation_numbers.py \
            --tex dissertation.tex chapters \
            --summary-json pilot-proxy/data/provenance/dissertation_summary_v3.json \
            --also-scan figure_src/data \
            --baseline .number-gate-baseline

      - name: Verify release-bundle manifest
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/release_manifest.py

      - name: Verify vendored evidence releases
        run: python -B scripts/verify_vendored_evidence.py
